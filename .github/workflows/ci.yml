name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --run

      - name: Pack package
        id: pack
        run: echo "tarball=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged artifact
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          pushd "$tmpdir" >/dev/null
          npm init -y >/dev/null
          npm install --ignore-scripts \
            "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}" \
            @codemirror/autocomplete@^6.20.3 \
            @codemirror/language@^6.12.3 \
            @codemirror/lint@^6.9.7 \
            @codemirror/state@^6.6.0 \
            @codemirror/view@^6.43.1 \
            @lezer/highlight@^1.0.0 \
            @lezer/lr@^1.4.10 >/dev/null

          node --input-type=module <<'EOF'
          import { opel, opelLanguage, opelExtensions, opelLinter } from '@allegro/codemirror-lang-opel';

          if (typeof opel !== 'function') throw new Error('opel export is not callable');
          if (typeof opelLanguage !== 'object') throw new Error('opelLanguage export is not available');
          if (typeof opelExtensions !== 'function') throw new Error('opelExtensions export is not callable');
          if (typeof opelLinter !== 'function') throw new Error('opelLinter export is not callable');
          EOF

          popd >/dev/null
